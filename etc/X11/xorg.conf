# --- SERVER LAYOUTS ---
Section "ServerLayout"
    Identifier     "Layout0"
    Screen      0  "Screen0" 0 0
EndSection

Section "ServerLayout"
    Identifier     "Layout1"
    Screen      0  "Screen1" 0 0
EndSection

# --- DEVICES ---
# seat0: Quadro P600 (NVIDIA proprietary)
Section "Device"
    Identifier     "Card0-NVIDIA"
    Driver         "nvidia"
    BusID          "PCI:3:0:0"
    Option         "ProbeAllGpus" "false"
EndSection

# seat1: R5 430 (radeon)
Section "Device"
    Identifier     "Card1-AMD"
    Driver         "radeon"
    BusID          "PCI:4:0:0"
EndSection

# --- SCREENS ---
Section "Screen"
    Identifier     "Screen0"
    Device         "Card0-NVIDIA"
    Monitor        "Monitor0"
EndSection

Section "Screen"
    Identifier     "Screen1"
    Device         "Card1-AMD"
    Monitor        "Monitor1"
EndSection

# --- MONITORS ---
Section "Monitor"
    Identifier     "Monitor0"
EndSection

Section "Monitor"
    Identifier     "Monitor1"
EndSection
